<!DOCTYPE html>
<html lang="en" data-admin-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b35">
  <meta name="description" content="Secure administrator access for VITAL.">
  <title>Admin Access | VITAL</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/vital.svg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/admin-login.js" defer></script>
</head>
<body class="admin-login-page">
  <main class="admin-login-screen">
    <div class="shooting-stars" aria-hidden="true">
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
    </div>
    <img class="planet planet-top" src="/assets/planets/planet-top-right.png" alt="" aria-hidden="true">
    <img class="planet planet-bottom" src="/assets/planets/planet-bottom-left.png" alt="" aria-hidden="true">

    <button class="admin-theme-toggle" id="adminThemeToggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
      </svg>
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
      </svg>
    </button>

    <section class="admin-login-content" aria-labelledby="adminAccessHeading">
      <div class="admin-brand" aria-label="VITAL, Every Indicator Matters. Every Life Counts.">
        <svg class="admin-brand-logo" viewBox="0 0 110 110" role="img" aria-label="VITAL astronaut helmet with heartbeat">
          <path d="M22 51a33 33 0 0 1 66 0v15h-7M27 66h-5V51" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 53h-4a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h6M90 53h4a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <rect x="22" y="46" width="66" height="37" rx="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M27 64h8l3-7 4 16 4-25 4 29 4-15 3 2" transform="translate(0 2)" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M57 64h24" transform="translate(0 2)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <text x="58" y="64" text-anchor="start" fill="currentColor" font-size="7" font-family="Outfit, sans-serif">ITAL</text>
          <path d="M24 85q31 10 62 0l-3 9q-28 8-56 0z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <p class="admin-brand-name">VITAL</p>
        <p class="admin-brand-tagline">Every Indicator Matters. Every Life Counts.</p>
      </div>

      <div class="admin-form-heading">
        <h1 id="adminAccessHeading">ADMIN ACCESS</h1>
        <p>Authorized administrators only.</p>
      </div>

      <form class="admin-login-form" id="adminLoginForm">
        <label class="admin-input-wrap" for="adminUsername">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20v-1.5a7 7 0 0 1 14 0V20z"></path>
          </svg>
          <input id="adminUsername" name="username" type="email" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>

        <label class="admin-input-wrap" for="adminPassword">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <circle cx="12" cy="15.5" r="1"></circle>
            <path d="M12 16.5v2"></path>
          </svg>
          <input id="adminPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="admin-password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15 15 0 0 1-3 3.6M6.2 6.3C3.9 7.7 2.5 12 2.5 12s3.4 6 9.5 6a9.7 9.7 0 0 0 3-.5"></path>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
            </svg>
          </button>
        </label>

        <label class="admin-remember">
          <input id="rememberDevice" name="remember" type="checkbox">
          <span class="admin-checkmark" aria-hidden="true"></span>
          <span>Remember this device</span>
        </label>

        <button class="admin-authorize-button" id="authorizeButton" type="submit">AUTHORIZE ACCESS</button>
        <p class="admin-auth-status" id="adminAuthStatus" role="status" aria-live="polite"></p>
      </form>

      <p class="admin-security-note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.5 2.9 8.2 7 10 4.1-1.8 7-5.5 7-10V6z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        Restricted access for approved administrators
      </p>
    </section>
  </main>
</body>
</html>
